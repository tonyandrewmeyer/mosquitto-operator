[tox]
requires =
    tox>=4.21
    tox-uv>=1.36
no_package = true
skip_missing_interpreters = true
# 'integration' and 'functional' both need more than a laptop checkout (a Juju
# controller, and a real Mosquitto installation, respectively), so bare `tox`
# does not run them.
env_list = format, lint, static, unit
min_version = 4.21

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
# Every environment installs from uv.lock, so the tool versions here are
# exactly the ones in CI and in the pre-commit hooks.
runner = uv-venv-lock-runner
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT = pdb.set_trace
    PY_COLORS = 1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS

[testenv:format]
description = Apply coding style standards to code
only_groups = lint
commands =
    ruff format {[vars]all_path}
    ruff check --fix {[vars]all_path}

[testenv:audit]
description = Check the locked runtime dependencies for known vulnerabilities
only_groups = audit
allowlist_externals = uv
commands =
    # The *runtime* graph, which is what actually ships inside the .charm: the
    # linters and test tools are not on the unit and are not what an advisory
    # against this charm would be about.
    uv export --frozen --no-dev --no-emit-project --no-hashes -o {env_tmp_dir}/runtime.txt
    #
    # PYSEC-2026-2447 (diskcache 5.6.3, reached through cosl): DiskCache stores
    # values with pickle, so anyone who can write the cache directory can run
    # code as whoever opens it -- which in a charm is root. There is no fixed
    # release to move to.
    #
    # It is not reachable here. The only caller that opens the cache is
    # `cosl.cos_tool._exec`, and every path to it is guarded by `if not
    # self.path`, where `path` resolves `cos-tool-<arch>` relative to the charm
    # directory. This charm ships no such binary, so `CosTool` disables itself
    # and the cache is never opened. Re-check this if the charm ever starts
    # shipping cos-tool, or if cosl changes how it memoizes.
    pip-audit --strict --requirement {env_tmp_dir}/runtime.txt --ignore-vuln PYSEC-2026-2447

[testenv:lint]
description = Check code against coding style standards
only_groups = lint
commands =
    codespell {tox_root}
    ruff check {[vars]all_path}
    ruff format --check --diff {[vars]all_path}

[testenv:static]
description = Run static type checks
# pyright needs the charm's own dependencies and every test dependency on the
# path, or it cannot resolve ops, pytest or jubilant.
dependency_groups =
    lint
    unit
    functional
    integration
set_env =
    {[testenv]set_env}
    # Pin the npm pyright, which is what actually determines the diagnostics.
    # The PyPI wrapper version is pinned in pyproject.toml.
    PYRIGHT_PYTHON_FORCE_VERSION = 1.1.414
commands =
    pyright {posargs}

[testenv:unit]
description = Run unit tests
dependency_groups =
    unit
commands =
    coverage run --source={[vars]src_path} -m pytest \
        --tb native \
        -v \
        -s \
        {[vars]tests_path}/unit \
        {posargs}
    coverage report
    coverage xml -o {tox_root}/coverage.xml

[testenv:functional]
description = Run functional tests against a real Mosquitto, without Juju
dependency_groups =
    functional
commands =
    # Reported, not gated: these are the only tests that reach the parts of
    # src/mosquitto.py that talk to apt, systemd and a real broker, and the unit
    # suite's `fail_under` cannot see any of it. The two data files are kept
    # apart so that a local run of one does not overwrite the other's.
    coverage run --source={[vars]src_path} --data-file={tox_root}/.coverage.functional -m pytest \
        --tb native \
        -v \
        -s \
        --log-cli-level=INFO \
        {[vars]tests_path}/functional \
        {posargs}
    coverage report --data-file={tox_root}/.coverage.functional
    coverage xml --data-file={tox_root}/.coverage.functional -o {tox_root}/coverage-functional.xml

[testenv:integration]
description = Run integration tests
dependency_groups =
    integration
pass_env =
    # tox does not merge an inherited pass_env when the key is redefined, so
    # repeat the base list here.
    {[testenv]pass_env}
    # The integration tests don't pack the charm. If CHARM_PATH is set, the tests deploy the
    # specified .charm file. Otherwise, the tests look for a .charm file in the project dir.
    CHARM_PATH
    JUJU_MODEL
    JUJU_DATA
commands =
    pytest \
        --tb native \
        -v \
        -s \
        --log-cli-level=INFO \
        {[vars]tests_path}/integration \
        {posargs}
