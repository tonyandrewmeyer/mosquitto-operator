# Keep this file minimal. `disable:` is a last resort, because a disabled rule
# does not appear in the suppressed-findings count and so new findings under it
# are silently missed. Prefer an inline `# zizmor: ignore[rule] <reason>`
# comment for a one-off, and a targeted `ignore:` entry here only when the
# finding is structural rather than incidental.
