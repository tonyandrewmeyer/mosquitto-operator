# This file configures Charmcraft.
# See https://canonical-charmcraft.readthedocs-hosted.com/en/stable/reference/files/charmcraft-yaml-file/
type: charm
name: mosquitto
title: Mosquitto MQTT Broker
summary: Eclipse Mosquitto MQTT message broker for IoT and messaging applications.
description: |
  Eclipse Mosquitto is an open-source MQTT message broker that provides a lightweight
  method of carrying out messaging using a publish/subscribe model.

  This charm deploys and configures Mosquitto to provide reliable MQTT messaging
  services with support for TLS encryption, client authentication, storage integration,
  monitoring, and comprehensive enterprise features.

  Mosquitto is ideal for Internet of Things (IoT) applications, real-time web messaging,
  microservices communication, and scenarios requiring reliable publish/subscribe
  messaging between devices and applications.

links:
  documentation: https://charmhub.io/mosquitto/docs
  website: https://mosquitto.org/
  source: https://github.com/canonical/mosquitto-operator
  issues: https://github.com/canonical/mosquitto-operator/issues
  contact: https://discourse.charmhub.io/

# Documentation:
# https://canonical-charmcraft.readthedocs-hosted.com/en/stable/howto/build-guides/select-platforms/
base: ubuntu@22.04
platforms:
  amd64:
  arm64:


parts:
  charm:
    plugin: charm
    source: .

# Charm libraries
charm-libs:
  - lib: operator_libs_linux.apt
    version: "0"
  - lib: operator_libs_linux.systemd
    version: "1"

# (Optional) Configuration options for the charm
# This config section defines charm config options, and populates the Configure
# tab on Charmhub.
# More information on this section at:
# https://canonical-charmcraft.readthedocs-hosted.com/en/stable/reference/files/charmcraft-yaml-file/#config
# General configuration documentation:
# https://canonical-juju.readthedocs-hosted.com/en/latest/user/reference/configuration/#application-configuration
config:
  options:
    port:
      description: |
        The network port that the MQTT broker will listen on for standard
        MQTT connections.
      default: 1883
      type: int
    websockets-port:
      description: |
        The network port for MQTT over WebSockets. Set to 0 to disable.
      default: 9001
      type: int
    max-connections:
      description: |
        The maximum number of concurrent client connections. Set to -1 for unlimited.
      default: -1
      type: int
    allow-anonymous:
      description: |
        Whether to allow clients to connect without providing credentials.
      default: false
      type: boolean
    log-level:
      description: |
        The logging level for Mosquitto.
        
        Acceptable values are: "error", "warning", "notice", "information", "debug"
      default: "notice"
      type: string
    persistence:
      description: |
        Whether to enable message persistence to disk.
      default: true
      type: boolean
    message-size-limit:
      description: |
        Maximum message size in bytes. Set to 0 for unlimited.
      default: 268435456
      type: int
    tls-port:
      description: |
        The network port for TLS-encrypted MQTT connections. Set to 0 to disable.
      default: 8883
      type: int
    tls-websockets-port:
      description: |
        The network port for TLS-encrypted MQTT over WebSockets. Set to 0 to disable.
      default: 9002
      type: int

# Storage configuration
storage:
  persistence:
    description: |
      Storage for persistent MQTT message data and configuration.
    type: filesystem
    minimum-size: 1G
    location: /var/lib/mosquitto

# Relations with other charms
requires:
  certificates:
    interface: tls-certificates
    optional: true
    description: |
      Obtain TLS certificates from a Certificate Authority for secure MQTT connections.
  sasl:
    interface: sasl
    optional: true
    description: |
      SASL authentication integration for client authentication.
  charm-tracing:
    interface: tracing
    limit: 1
    optional: true
    description: |
      Sends tracing data to a tracing backend for observability.
  receive-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true
    description: |
      Receive CA certificate for secure tracing connections.

provides:
  metrics:
    interface: prometheus_scrape
    optional: true
    description: |
      Prometheus metrics endpoint for monitoring Mosquitto performance and status.

# Actions that can be run on deployed units
actions:
  restart:
    description: Restart the Mosquitto service
  get-status:
    description: Get detailed status information about the Mosquitto service
  backup:
    description: Create a backup of persistent data and configuration
    params:
      backup-name:
        type: string
        description: Name for the backup (defaults to timestamp)
  restore:
    description: Restore from a backup
    params:
      backup-name:
        type: string
        description: Name of the backup to restore
    required:
      - backup-name
  generate-client-cert:
    description: Generate a client certificate for MQTT authentication
    params:
      client-name:
        type: string
        description: Common name for the client certificate
      output-path:
        type: string
        description: Path where certificate files will be stored
        default: "/tmp"
    required:
      - client-name
  get-metrics-status:
    description: Get status of Prometheus metrics exporter
