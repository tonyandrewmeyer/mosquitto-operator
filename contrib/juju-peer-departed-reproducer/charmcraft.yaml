type: charm
name: peertest
title: Peer relation departure reproducer
summary: Reports what a unit sees on its peer relation.
description: |
  A minimal charm for reproducing a Juju question: after `juju remove-unit`, does
  the surviving unit still see the removed unit in its peer relation, and does it
  get a peer relation-departed event?

  It has no workload, no storage and no dependencies beyond ops.

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

peers:
  peers:
    interface: peertest
