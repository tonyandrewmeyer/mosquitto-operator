type: charm
name: peertest
title: Peer relation departure reproducer
summary: Reports what a unit sees on its peer relation.
description: |
  A minimal charm for reproducing a Juju question: after `juju remove-unit`, does
  the surviving unit still see the removed unit in its peer relation, and does it
  get a peer relation-departed event?

  It has no workload, no storage and no dependencies beyond ops.

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

peers:
  peers:
    interface: peertest

# So the same charm can be deployed twice and integrated with itself, covering an
# ordinary provides/requires relation as well as the peer one.
provides:
  regular:
    interface: peertest-regular

requires:
  regular-req:
    interface: peertest-regular
    optional: true
